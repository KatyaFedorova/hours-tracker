<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hours</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><g fill="none" stroke="%231c2430" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M25 8h14M32 8v6M48 16l4-4"/><circle cx="32" cy="35" r="22"/><path d="M32 24v12l8 5"/></g><g fill="%231c2430"><circle cx="32" cy="19" r="2.2"/><circle cx="32" cy="51" r="2.2"/><circle cx="16" cy="35" r="2.2"/><circle cx="48" cy="35" r="2.2"/><circle cx="21" cy="24" r="2"/><circle cx="43" cy="24" r="2"/><circle cx="21" cy="46" r="2"/><circle cx="43" cy="46" r="2"/></g></svg>' />
<style>
  *{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  body{margin:0;background:#f5f6f8;color:#1c2430;display:flex;justify-content:center;padding:32px 16px}
  .wrap{width:100%;max-width:1040px}
  .topbar{display:grid;grid-template-columns:auto minmax(280px,420px);gap:18px;align-items:center;margin-bottom:18px}
  h1{font-size:28px;font-weight:700;margin:0}
  h2{font-size:22px;font-weight:700;margin:0 0 14px;text-align:center}
  .brand{display:flex;align-items:center;gap:10px}
  .topbar .brandblock{align-self:start;margin-top:18px}
  .brand.center{justify-content:center}
  /* 5x the old 14px, easing down on narrow screens so it still fits. */
  .tagline{margin:10px 0 0;color:#7a828f;font-size:clamp(30px,7vw,70px);line-height:1.08;font-weight:600}
  .tagline.center{text-align:center;margin-bottom:18px}
  .clockicon{width:1.15em;height:1.15em;flex:none}
  .card{background:#fff;border:1px solid #e6e9ee;border-radius:8px;padding:14px;box-shadow:0 4px 16px rgba(20,30,50,.05)}
  label{display:block;font-size:12px;font-weight:700;color:#7a828f;text-transform:uppercase;letter-spacing:.5px;margin:0 0 5px}
  input{width:100%;padding:11px 12px;font-size:16px;border:1.5px solid #dde1e8;border-radius:9px;outline:none}
  input:focus{border-color:#3b6cf6}
  button{font-family:inherit;cursor:pointer;border:none}
  .auth{width:100%;max-width:380px;margin:40px auto 0}
  .auth .card{padding:18px}
  .googlebtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:11px 16px;background:#fff;color:#1c2430;font-size:15px;font-weight:700;border:1.5px solid #dde1e8;border-radius:9px}
  .googlemark{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#f5f6f8;color:#3b6cf6;font-weight:800}
  .userbar{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-bottom:12px;color:#7a828f;font-size:13px}
  .signout{background:none;color:#3b6cf6;font-weight:700;padding:0}
  .addproj{display:flex;gap:10px}
  .addproj input{flex:1}
  .btn{padding:11px 16px;background:#3b6cf6;color:#fff;font-size:15px;font-weight:600;border-radius:9px;white-space:nowrap}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.5}

  #projects{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;align-items:start}
  .proj{background:#fff;border:1px solid #e6e9ee;border-radius:8px;padding:14px;box-shadow:0 4px 16px rgba(20,30,50,.05)}
  .proj .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .proj .nm{flex:1;min-width:0;margin-right:8px;font-weight:700;font-size:17px}
  .proj .nameedit{width:100%;min-width:0;padding:0;border:0;border-radius:0;background:transparent;color:inherit;font-size:17px;font-weight:700}
  .proj .nameedit:focus{border:0;box-shadow:none;outline:2px solid #dbe3ff;outline-offset:4px}
  .proj .right{display:flex;align-items:center;gap:8px}
  .proj .tot{font-weight:700;font-size:16px;color:#3b6cf6;white-space:nowrap}
  .proj .delp{display:grid;place-items:center;width:24px;height:24px;background:none;color:#c2c8d0;font-size:22px;line-height:1;border-radius:50%;opacity:.55}
  .proj:hover .delp{opacity:1}
  .proj .delp:hover{color:#e5484d}
  .logrow{display:flex;gap:8px;margin-bottom:10px}
  .logrow input{flex:1}
  .logrow .btn{padding:11px 14px;font-size:14px}
  .entries{border-top:1px solid #eef0f4;padding-top:8px}
  .entries.scroll{max-height:96px;overflow-y:auto;padding-right:5px}
  .entries.scroll::-webkit-scrollbar{width:6px}
  .entries.scroll::-webkit-scrollbar-track{background:#f1f3f6;border-radius:999px}
  .entries.scroll::-webkit-scrollbar-thumb{background:#c8ced8;border-radius:999px}
  .entry{display:flex;align-items:center;justify-content:space-between;font-size:14px;padding:6px 2px;color:#41495a}
  .entry .ed{color:#9aa1ac;font-size:12px}
  .entry .eh{font-weight:600;margin-left:auto;margin-right:8px}
  .entry .dele{background:none;color:#cfd4dc;font-size:15px;line-height:1}
  .entry .dele:hover{color:#e5484d}
  .noentry{color:#aab0ba;font-size:13px;padding:4px 2px}

  .empty{text-align:center;color:#9aa1ac;padding:26px 10px;font-size:14px}
  .status{text-align:center;font-size:13px;margin:4px 0 14px;min-height:18px;color:#9aa1ac}
  .status.err{color:#e5484d}
  @media (max-width: 700px){
    body{padding:24px 12px}
    .topbar{grid-template-columns:1fr;gap:14px}
    h1{text-align:center;font-size:24px}
    #projects{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="auth" id="authView">
    <div class="card">
      <h2 class="brand center"><svg class="clockicon" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M25 8h14M32 8v6M48 16l4-4"/><circle cx="32" cy="35" r="22"/><path d="M32 24v12l8 5"/></g><g fill="currentColor"><circle cx="32" cy="19" r="2.2"/><circle cx="32" cy="51" r="2.2"/><circle cx="16" cy="35" r="2.2"/><circle cx="48" cy="35" r="2.2"/><circle cx="21" cy="24" r="2"/><circle cx="43" cy="24" r="2"/><circle cx="21" cy="46" r="2"/><circle cx="43" cy="46" r="2"/></g></svg><span>Hours</span></h2>
      <p class="tagline center">Do it for 20 hours to master the skill.</p>
      <button class="googlebtn" id="googleSignin"><span class="googlemark">G</span>Continue with Google</button>
      <div class="status" id="authStatus"></div>
    </div>
  </div>

  <div id="appView" style="display:none">
    <div class="userbar">
      <span id="userEmail"></span>
      <button class="signout" id="signout">Sign out</button>
    </div>

    <div class="topbar">
      <div class="brandblock">
        <h1 class="brand"><svg class="clockicon" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M25 8h14M32 8v6M48 16l4-4"/><circle cx="32" cy="35" r="22"/><path d="M32 24v12l8 5"/></g><g fill="currentColor"><circle cx="32" cy="19" r="2.2"/><circle cx="32" cy="51" r="2.2"/><circle cx="16" cy="35" r="2.2"/><circle cx="48" cy="35" r="2.2"/><circle cx="21" cy="24" r="2"/><circle cx="43" cy="24" r="2"/><circle cx="21" cy="46" r="2"/><circle cx="43" cy="46" r="2"/></g></svg><span>Hours</span></h1>
        <p class="tagline">Do it for 20 hours to master the skill.</p>
      </div>

      <div class="card">
        <label>New project</label>
        <div class="addproj">
          <input id="newproj" placeholder="Project name" />
          <button class="btn" id="addproj">Add</button>
        </div>
      </div>
    </div>

    <div class="status" id="status">Loading…</div>
    <div id="projects"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Real database (Supabase) — projects & hours stored on the server.
  const SUPABASE_URL = "https://gqhdoyrvhmzeelgzuoft.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdxaGRveXJ2aG16ZWVsZ3p1b2Z0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2ODM0NzYsImV4cCI6MjA5NjI1OTQ3Nn0.n_0xx7VnQXhncdRdonVZMKWRDXYS1O8e5YyCZKowf18";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let projects = [], hours = [], session = null;
  const $ = id => document.getElementById(id);
  const fmt = h => (Math.round(h*100)/100) + " h";
  const fmtDate = t => new Date(t).toLocaleDateString(undefined,{month:"short",day:"numeric"});
  const escapeHtml = s => (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  function status(msg,cls){ const s=$("status"); s.textContent=msg||""; s.className="status"+(cls?" "+cls:""); }
  function authStatus(msg,cls){ const s=$("authStatus"); s.textContent=msg||""; s.className="status"+(cls?" "+cls:""); }

  function showSignedOut(){
    session = null;
    projects = []; hours = [];
    $("authView").style.display = "block";
    $("appView").style.display = "none";
  }

  async function showSignedIn(nextSession){
    session = nextSession;
    $("authView").style.display = "none";
    $("appView").style.display = "block";
    $("userEmail").textContent = session.user.email || "";
    await load();
  }

  async function load(){
    if(!session){ showSignedOut(); return; }
    status("Loading…");
    const [{data:pr,error:e1},{data:hr,error:e2}] = await Promise.all([
      sb.from("projects").select("*").order("created_at",{ascending:true}),
      sb.from("hours").select("*").not("project_id","is",null).order("created_at",{ascending:false})
    ]);
    if(e1||e2){ status("Couldn't reach the database: "+((e1||e2).message), "err"); return; }
    projects = pr || []; hours = hr || [];
    status(""); render();
  }

  function render(){
    const box = $("projects");
    if(!projects.length){
      box.innerHTML = `<div class="empty">No projects yet. Add one above to start logging hours.</div>`;
      return;
    }
    const totals = new Map(projects.map(p=>[
      p.id,
      hours.filter(h=>h.project_id===p.id).reduce((s,h)=>s+Number(h.hours),0)
    ]));
    const sortedProjects = [...projects].sort((a,b)=>
      (totals.get(b.id)||0) - (totals.get(a.id)||0)
      || a.name.localeCompare(b.name)
    );
    box.innerHTML = sortedProjects.map(p=>{
      const mine = hours.filter(h=>h.project_id===p.id);
      const tot = totals.get(p.id) || 0;
      const entries = mine.length
        ? mine.map(h=>`<div class="entry"><span class="ed">${fmtDate(h.created_at)}</span><span class="eh">${fmt(h.hours)}</span><button class="dele" data-h="${h.id}" title="Delete entry">✕</button></div>`).join("")
        : `<div class="noentry">No hours logged yet.</div>`;
      return `<div class="proj">
        <div class="head">
          <div class="nm"><input class="nameedit" data-name="${p.id}" value="${escapeHtml(p.name)}" title="Edit project name" /></div>
          <div class="right"><span class="tot">${fmt(tot)}</span><button class="delp" data-p="${p.id}" title="Delete project">×</button></div>
        </div>
        <div class="logrow">
          <input type="number" step="0.25" min="0" placeholder="Add hours…" data-input="${p.id}" />
          <button class="btn" data-add="${p.id}">Log</button>
        </div>
        <div class="entries${mine.length>3?" scroll":""}">${entries}</div>
      </div>`;
    }).join("");

    box.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>logHours(b.dataset.add));
    box.querySelectorAll("[data-input]").forEach(i=>i.addEventListener("keydown",e=>{ if(e.key==="Enter") logHours(i.dataset.input); }));
    box.querySelectorAll("[data-name]").forEach(n=>{
      n.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); n.blur(); } });
      n.addEventListener("blur",()=>renameProject(n.dataset.name,n.value.trim()));
    });
    box.querySelectorAll(".delp").forEach(b=>b.onclick=()=>delProject(b.dataset.p));
    box.querySelectorAll(".dele").forEach(b=>b.onclick=()=>delHours(b.dataset.h));
  }

  async function addProject(){
    const name = $("newproj").value.trim();
    if(!name){ $("newproj").focus(); return; }
    $("addproj").disabled = true; status("Saving…");
    const { error } = await sb.from("projects").insert({ name });
    $("addproj").disabled = false;
    if(error){ status("Couldn't add project: "+error.message,"err"); return; }
    $("newproj").value=""; $("newproj").focus();
    await load();
  }

  async function signInWithGoogle(){
    $("googleSignin").disabled = true;
    authStatus("Opening Google…");
    const options = {};
    if(window.location.protocol !== "file:"){
      options.redirectTo = window.location.origin + window.location.pathname;
    }
    const { error } = await sb.auth.signInWithOAuth({ provider: "google", options });
    $("googleSignin").disabled = false;
    if(error){ authStatus("Couldn't open Google: "+error.message,"err"); }
  }

  async function signOut(){
    await sb.auth.signOut();
    showSignedOut();
  }

  async function delProject(id){
    const p = projects.find(x=>x.id===id);
    if(!confirm(`Delete "${p?p.name:"this project"}" and all its hours?`)) return;
    const { error } = await sb.from("projects").delete().eq("id", id);
    if(error){ status("Couldn't delete: "+error.message,"err"); return; }
    await load();
  }

  async function renameProject(id,name){
    const p = projects.find(x=>x.id===id);
    if(!p || !name || name===p.name){ render(); return; }
    status("Saving…");
    const { data, error } = await sb.from("projects").update({ name }).eq("id", id).select("id,name").maybeSingle();
    if(error){ status("Couldn't rename project: "+error.message,"err"); render(); return; }
    if(!data){ status("Couldn't rename project: Supabase update policy is not enabled yet.","err"); render(); return; }
    await load();
  }

  async function logHours(projectId){
    const input = document.querySelector(`[data-input="${projectId}"]`);
    const project = projects.find(p=>p.id===projectId);
    const h = parseFloat(input.value);
    if(!h || h<=0){ input.focus(); return; }
    status("Saving…");
    const { error } = await sb.from("hours").insert({ project_id: projectId, project: project ? project.name : "", hours: h });
    if(error){ status("Couldn't save: "+error.message,"err"); return; }
    await load();
  }

  async function delHours(id){
    const { error } = await sb.from("hours").delete().eq("id", id);
    if(error){ status("Couldn't delete: "+error.message,"err"); return; }
    await load();
  }

  $("addproj").onclick = addProject;
  $("newproj").addEventListener("keydown", e=>{ if(e.key==="Enter") addProject(); });
  $("googleSignin").onclick = signInWithGoogle;
  $("signout").onclick = signOut;
  sb.auth.onAuthStateChange((_event,nextSession)=>{
    if(nextSession){ showSignedIn(nextSession); }
    else{ showSignedOut(); }
  });
  sb.auth.getSession().then(({data})=>{
    if(data.session){ showSignedIn(data.session); }
    else{ showSignedOut(); }
  });
</script>
</body>
</html>
